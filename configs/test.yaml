# Test tier (laptop CPU, 16 threads, 30-45 min, < 6 GB). Handoff 02. Schema: docs/INTERFACES.md "Config YAML".
# Must reproduce OOF FIT 0.026 +/- 0.004 for lgbm_everest; records per-fit wall times (CatBoost keep/drop decision).
name: test
run:
  seed: 0
  threads: 16
  min_era: 2800
  max_era: null
  min_rows: null
  time_decay: false
  data_dir: data
cv:
  n_folds: 5
  purge: 20
  embargo: 20
  inner_frac: 0.15
  inner_gap: 20
  forward:
    enabled: true
    train_end: 5925      # forward block: train eras < 5925 (then 20 gap), test 5945..6524
    test_start: 5945
members:
  # 12 LGBM everest grid cells, searched exhaustively (see search.lgbm_everest), top-3 averaged.
  - name: lgbm_everest
    family: lgbm
    target: target_everest
    group: everest
    features: all
    input: nan
    params: {num_leaves: 8, learning_rate: 0.03, min_data_in_leaf: 2000, feature_fraction: 0.3,
             lambda_l2: 10, bagging_fraction: 0.7, bagging_freq: 1, max_bin: 16}
    n_estimators: null   # inner early stopping, median best-iter frozen
    es_cap: 1500
  # 3 aux targets at the family-best everest params (params resolved from search results at run time)
  - {name: lgbm_tougroute, family: lgbm, target: target_Tougroute, group: aux, features: all, input: nan,
     params: {best_of: lgbm_everest}, n_estimators: null, es_cap: 1500}
  - {name: lgbm_ghat, family: lgbm, target: target_Ghat, group: aux, features: all, input: nan,
     params: {best_of: lgbm_everest}, n_estimators: null, es_cap: 1500}
  - {name: lgbm_meltsene, family: lgbm, target: target_Meltsene, group: aux, features: all, input: nan,
     params: {best_of: lgbm_everest}, n_estimators: null, es_cap: 1500}
  # 4 fixed XGB CPU-hist configs (not searched)
  - {name: xgb_everest_d3_lr05, family: xgb, target: target_everest, group: everest, features: all, input: nan,
     params: {max_depth: 3, learning_rate: 0.05, min_child_weight: 200, subsample: 0.7, colsample_bytree: 0.3,
              reg_lambda: 10, tree_method: hist, max_bin: 16}, n_estimators: null, es_cap: 1500}
  - {name: xgb_everest_d4_lr05, family: xgb, target: target_everest, group: everest, features: all, input: nan,
     params: {max_depth: 4, learning_rate: 0.05, min_child_weight: 1000, subsample: 0.7, colsample_bytree: 0.3,
              reg_lambda: 10, tree_method: hist, max_bin: 16}, n_estimators: null, es_cap: 1500}
  - {name: xgb_everest_d3_lr02, family: xgb, target: target_everest, group: everest, features: all, input: nan,
     params: {max_depth: 3, learning_rate: 0.02, min_child_weight: 200, subsample: 0.7, colsample_bytree: 0.3,
              reg_lambda: 10, tree_method: hist, max_bin: 16}, n_estimators: null, es_cap: 1500}
  - {name: xgb_everest_d6_lr02, family: xgb, target: target_everest, group: everest, features: all, input: nan,
     params: {max_depth: 6, learning_rate: 0.02, min_child_weight: 1000, subsample: 0.7, colsample_bytree: 0.3,
              reg_lambda: 10, tree_method: hist, max_bin: 16}, n_estimators: null, es_cap: 1500}
  # 1 CatBoost config, TIMED (kept in full.yaml only if <= timing.catboost_max_fit_seconds per fit)
  - {name: cat_everest_l2_30, family: cat, target: target_everest, group: everest, features: all, input: nan,
     params: {depth: 4, learning_rate: 0.05, l2_leaf_reg: 30, iterations: 400, border_count: 16},
     n_estimators: 400, es_cap: null}
  - {name: ridge_everest, family: ridge, target: target_everest, group: everest, features: all, input: linear,
     params: {alpha: 1.0e5}, n_estimators: null, es_cap: null}
search:
  lgbm_everest:
    grid:
      num_leaves: [4, 8, 16]
      learning_rate: [0.03]
      min_data_in_leaf: [500, 2000]
      feature_fraction: [0.15, 0.3]
      lambda_l2: [10]
    n_trials: 12         # == grid size -> exhaustive
    top_k: 3
    adopt_gate: false    # M1 behaviour (top-k always averaged); the M2 adoption gate is on in full/minifull
blend:
  everest_weight: 0.5
  nnls: true             # computed nested; adopted only if paired gate passes vs equal weight
  p_b: 0.5
  p_c: 0.25
  simulation:
    n_draws: 500
    p_b_grid: [0.0, 0.25, 0.5, 0.75]
    bench_fit_means: [0.0, 0.009, 0.02]
    bench_fit_sd: 0.035
    seed: 0
bootstrap:
  block: 20
  n_boot: 2000
  seed: 0
gates:
  leak_spearman: 0.18
  suspect_gain_over_baseline: 0.004
  p_pos_adopt: 0.8
timing:
  catboost_max_fit_seconds: 120
  progress_every_seconds: 60
